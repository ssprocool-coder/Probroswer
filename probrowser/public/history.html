<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pro Browser — History</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div class="history-page">
  <div class="history-header">
    <div style="display:flex;align-items:center;gap:10px">
      <a href="/" style="text-decoration:none;font-size:1.1rem;color:var(--text-primary)">←</a>
      <span class="history-title">History</span>
    </div>
    <button class="btn btn-danger" id="clearAllBtn" style="font-size:.8rem;padding:6px 12px">Clear All</button>
  </div>

  <div style="padding:0 16px 8px">
    <div class="cat-tabs">
      <button class="cat-tab active" id="tabBrowse" onclick="showTab('browse')">Browsing</button>
      <button class="cat-tab" id="tabSearch" onclick="showTab('search')">Searches</button>
    </div>
  </div>

  <div class="history-list" id="browseList"></div>
  <div class="history-list" id="searchList" style="display:none"></div>
</div>

<script src="app.js"></script>
<script src="history.js"></script>
</body>
</html>
