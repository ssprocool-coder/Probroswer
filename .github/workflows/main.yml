name: Build Pro Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          tar -xzf probrowser-v2.tar.gz -C project
          echo "Extracted project:"
          find project -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          find project -name gradlew -type f -print

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: |
          chmod +x $(find project -name gradlew -type f | head -1)

      - name: Build APK
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProBrowser-debug-apk
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
