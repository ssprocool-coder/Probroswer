name: Inspect Pro Browser

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract archive
        run: |
          mkdir -p project
          tar -xzf probrowser-v2.tar.gz -C project

      - name: Show project structure
        run: |
          echo "===== PROJECT FILES ====="
          find project -maxdepth 5 -type f | sort

          echo "===== GRADLE WRAPPER ====="
          find project -type f -name "gradlew" -print

          echo "===== ANDROID FILES ====="
          find project -type f \( \
            -name "AndroidManifest.xml" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          \) -print
